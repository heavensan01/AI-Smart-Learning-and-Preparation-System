{% extends "base.html" %}
{% block title %}Admin Login · Smart Study{% endblock %}
{% block guest_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <div class="logo-dot"></div>
      <h2>Admin Login</h2>
      <p style="color:var(--text-muted); font-size:.86rem;">Manage students, teachers, subjects and exams</p>
    </div>
    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" required placeholder="admin username" autofocus>
      <label>Password</label>
      <div class="password-field">
        <input type="password" name="password" id="loginPassword" required placeholder="Password">
        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('loginPassword', this)" aria-label="Show password">
          {{ icon('eye', size=17, cls='icon-eye') }}
          {{ icon('eye-off', size=17, cls='icon-eye-off') }}
        </button>
      </div>
      <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:16px;" type="submit">Log in</button>
    </form>
    <p style="text-align:center; margin-top:16px; font-size:.8rem;">
      <a href="{{ url_for('index') }}">← Back</a>
    </p>
  </div>
</div>
<script>
function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  const isVisible = input.type === 'text';
  input.type = isVisible ? 'password' : 'text';
  btn.classList.toggle('is-visible', !isVisible);
}
</script>
{% endblock %}
