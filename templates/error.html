{% extends "base.html" %}
{% block title %}{{ code }} · Smart Study{% endblock %}
{% block content %}
<div class="card" style="max-width:480px; text-align:center; margin-top:60px;">
  <h2>{{ code }}</h2>
  <p style="color:var(--text-muted);">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('index') }}">Back home</a>
</div>
{% endblock %}
{% block guest_content %}
<div class="auth-wrap">
  <div class="auth-card" style="text-align:center;">
    <h2>{{ code }}</h2>
    <p style="color:var(--text-muted);">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('index') }}">Go home</a>
  </div>
</div>
{% endblock %}
